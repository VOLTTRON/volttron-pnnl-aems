tls:
  certificates:
    # Names APP_HOSTNAME; Traefik picks it by SNI.
    - certFile: /etc/certs/mkcert-hostname.crt
      keyFile: /etc/certs/mkcert-hostname.key
      stores:
        - default
    - certFile: /etc/certs/mkcert-local.crt
      keyFile: /etc/certs/mkcert-local.key
      stores:
        - default
  stores:
    default:
      defaultCertificate:
        certFile: /etc/certs/mkcert-local.crt
        keyFile: /etc/certs/mkcert-local.key
  # tls.options.default is in dynamic.yml; the same key in two files is a conflict.
